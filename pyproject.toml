[project]
name = "graphify-daemon"
version = "0.1.0"
description = "Local MCP daemon that keeps a knowledge graph derived from an Obsidian vault resident in RAM and serves it to concurrent AI agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "c-ibarra", email = "105107110+c-ibarra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "graphifyy==0.9.34",
    "httpx>=0.28.1",
    "jsonschema>=4.0",
    "mcp>=2.0.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
    "watchdog>=6.0.0",
]

[project.scripts]
graphify-daemon = "graphify_daemon.daemon:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
    "mypy>=1.19",
    "types-jsonschema>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["graphify", "graphify.*", "networkx", "networkx.*"]
ignore_missing_imports = true
